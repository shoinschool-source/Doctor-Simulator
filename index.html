<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>診療所メモリーズ ～ English Diagnosis ～</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }

    body {
      background-color: #111;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: "MS Gothic", "Hiragino Kaku Gothic Pro", Osaka, monospace;
      color: #fff;
    }

    /* 90s Game Screen Frame */
    .game-screen {
      position: relative;
      width: 100%;
      max-width: 800px;
      height: 650px;
      background: linear-gradient(180deg, #b8d0e8 0%, #e8f0f8 50%, #a0b8d0 100%);
      border: 6px solid #4a3b52;
      border-radius: 8px;
      box-shadow: 0 0 20px rgba(0,0,0,0.8), inset 0 0 10px rgba(255,255,255,0.5);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Top HUD / Status Bar */
    .hud-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 20px;
      background: rgba(20, 20, 40, 0.85);
      border-bottom: 2px solid #8a7b93;
      font-weight: bold;
      font-size: 14px;
      color: #ffd700;
      text-shadow: 1px 1px 0 #000;
      z-index: 10;
      flex-shrink: 0;
    }

    /* Main Stage - Dynamically fills all remaining vertical area */
    .stage {
      flex: 1;
      position: relative;
      width: 100%;
      min-height: 0; /* Prevents flex collapse */
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .character-avatar {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .character-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }

    /* Correct Answer Pop-up Box */
    .popup-box {
      position: absolute;
      top: 35%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      background: rgba(15, 23, 42, 0.95);
      border: 4px solid #ffd700;
      border-radius: 12px;
      padding: 20px 40px;
      text-align: center;
      box-shadow: 0 0 25px rgba(255, 215, 0, 0.5), inset 0 0 10px rgba(0,0,0,0.8);
      z-index: 100;
      opacity: 0;
      visibility: hidden;
      transition: all 0.25s ease-in-out;
      pointer-events: none;
    }

    .popup-box.show {
      opacity: 1;
      visibility: visible;
      transform: translate(-50%, -50%) scale(1);
    }

    .popup-title {
      color: #4ade80;
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 10px;
      text-shadow: 2px 2px 0px #000;
    }

    .popup-points {
      color: #ffd700;
      font-size: 32px;
      font-weight: bold;
      text-shadow: 2px 2px 0px #000;
    }

    /* 90s Dialogue Box Area */
    .dialogue-container {
      position: relative;
      margin: 10px 15px;
      min-height: 90px;
      background: rgba(15, 15, 35, 0.9);
      border: 3px solid #d4af37;
      border-radius: 6px;
      padding: 12px 20px;
      box-shadow: inset 0 0 8px rgba(0,0,0,0.8);
      flex-shrink: 0;
      z-index: 5;
    }

    /* Speaker Name Tag Box */
    .name-box {
      position: absolute;
      top: -16px;
      left: 15px;
      background: #8b0000;
      border: 2px solid #d4af37;
      color: #ffffff;
      padding: 1px 12px;
      font-size: 12px;
      font-weight: bold;
      border-radius: 4px;
      box-shadow: 2px 2px 0px #000;
    }

    .dialogue-text {
      font-size: 16px;
      line-height: 1.4;
      color: #ffffff;
      text-shadow: 1px 1px 2px #000;
      margin-top: 4px;
      white-space: pre-line;
    }

    /* Choice Options Container */
    .choice-container {
      background: rgba(10, 10, 25, 0.95);
      border-top: 2px solid #4a3b52;
      padding: 10px 15px 15px 15px;
      flex-shrink: 0;
      z-index: 5;
    }

    .choice-title {
      font-size: 12px;
      color: #ffd700;
      margin-bottom: 8px;
      text-align: center;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .choice-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
    }

    .choice-btn {
      background: linear-gradient(180deg, #1f2937 0%, #111827 100%);
      border: 1px solid #6b7280;
      color: #f3f4f6;
      padding: 8px 4px;
      font-family: inherit;
      font-size: 12px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s ease;
      box-shadow: 1px 1px 3px rgba(0,0,0,0.5);
    }

    .choice-btn:hover:not(:disabled) {
      background: linear-gradient(180deg, #b91c1c 0%, #7f1d1d 100%);
      border-color: #ffd700;
      color: #fff;
    }

    .choice-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    @media (max-width: 600px) {
      .choice-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>
<body>

<div class="game-screen">
  <!-- Top Status HUD -->
  <div class="hud-bar">
    <span>LOCATION: 診察室 (Clinic)</span>
    <span id="scoreDisplay">SCORE: 0</span>
  </div>

  <!-- Correct Popup Box -->
  <div class="popup-box" id="scorePopup">
    <div class="popup-title">【 正解 / CORRECT! 】</div>
    <div class="popup-points" id="popupPoints">+10 PTS</div>
  </div>

  <!-- Character Stage -->
  <div class="stage">
    <div class="character-avatar">
      <img id="patientImage" src="" alt="Patient Portrait">
    </div>
  </div>

  <!-- Dialogue Window -->
  <div class="dialogue-container">
    <div class="name-box" id="nameBox">患者</div>
    <div class="dialogue-text" id="dialogueText">Loading...</div>
  </div>

  <!-- Choice Menu -->
  <div class="choice-container">
    <div class="choice-title">【 診断を選択してください / SELECT DIAGNOSIS 】</div>
    <div class="choice-grid" id="choiceGrid"></div>
  </div>
</div>

<script>
  // 10 Game Scenarios mapped to patients/char_1.png through char_10.png
  const scenarios = [
    { id: "char_1", symptom: "My head hurts and I feel hot...", diagnosis: "Fever" },
    { id: "char_2", symptom: "I have a cough and a runny nose...", diagnosis: "Cold" },
    { id: "char_3", symptom: "My stomach hurts after lunch...", diagnosis: "Stomachache" },
    { id: "char_4", symptom: "My eyes are red and itchy...", diagnosis: "Allergy" },
    { id: "char_5", symptom: "My throat hurts when I talk...", diagnosis: "Sore Throat" },
    { id: "char_6", symptom: "I fell down and my head hurts...", diagnosis: "Headache" },
    { id: "char_7", symptom: "My tooth hurts when I eat...", diagnosis: "Toothache" },
    { id: "char_8", symptom: "My leg hurts and I cannot run...", diagnosis: "Injury" },
    { id: "char_9", symptom: "I feel dizzy and very tired...", diagnosis: "Fatigue" },
    { id: "char_10", symptom: "My skin is red and hot from the sun...", diagnosis: "Sunburn" }
  ];

  let score = 0;
  let currentScenario = null;
  let isProcessing = false;
  let currentPotentialPoints = 10;

  const dialogueText = document.getElementById("dialogueText");
  const nameBox = document.getElementById("nameBox");
  const scoreDisplay = document.getElementById("scoreDisplay");
  const patientImage = document.getElementById("patientImage");
  const choiceGrid = document.getElementById("choiceGrid");
  const scorePopup = document.getElementById("scorePopup");
  const popupPoints = document.getElementById("popupPoints");

  function initGame() {
    renderChoices();
    nextPatient();
  }

  function renderChoices() {
    choiceGrid.innerHTML = "";
    scenarios.forEach(scen => {
      const btn = document.createElement("button");
      btn.className = "choice-btn";
      btn.textContent = scen.diagnosis;
      btn.onclick = (e) => checkDiagnosis(scen.diagnosis, e.target);
      choiceGrid.appendChild(btn);
    });
  }

  function toggleButtons(enable) {
    const buttons = choiceGrid.querySelectorAll("button");
    buttons.forEach(btn => btn.disabled = !enable);
  }

  function nextPatient() {
    isProcessing = false;
    currentPotentialPoints = 10;
    scorePopup.classList.remove("show");
    toggleButtons(true);

    const randomIndex = Math.floor(Math.random() * scenarios.length);
    currentScenario = scenarios[randomIndex];

    nameBox.textContent = "患者";
    dialogueText.textContent = `"${currentScenario.symptom}"`;
    
    patientImage.src = `patients/${currentScenario.id}.png`;
  }

  function checkDiagnosis(selected, clickedBtn) {
    if (isProcessing) return;

    if (selected === currentScenario.diagnosis) {
      isProcessing = true;
      toggleButtons(false);

      score += currentPotentialPoints;
      scoreDisplay.textContent = `SCORE: ${score}`;
      dialogueText.textContent = `【正解】\n「ありがとう、先生！(Thank you, Doctor!)」`;

      popupPoints.textContent = `+${currentPotentialPoints} PTS`;
      scorePopup.classList.add("show");

      setTimeout(nextPatient, 3000);
    } else {
      clickedBtn.disabled = true;

      if (currentPotentialPoints > 1) {
        currentPotentialPoints--;
      }

      dialogueText.textContent = `【不正解】\n「違います… もう一度考えてみてください！」\n(Worth ${currentPotentialPoints} pts now)`;
    }
  }

  window.onload = initGame;
</script>

</body>
</html>
