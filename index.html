<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>診療所メモリーズ ～ English Diagnosis ～</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }

    body {
      background-color: #111;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: "MS Gothic", "Hiragino Kaku Gothic Pro", Osaka, monospace;
      color: #fff;
    }

    /* 90s Game Screen Frame */
    .game-screen {
      position: relative;
      width: 100%;
      max-width: 800px;
      height: 650px;
      background: linear-gradient(180deg, #b8d0e8 0%, #e8f0f8 50%, #a0b8d0 100%);
      border: 6px solid #4a3b52;
      border-radius: 8px;
      box-shadow: 0 0 20px rgba(0,0,0,0.8), inset 0 0 10px rgba(255,255,255,0.5);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Top HUD / Status Bar */
    .hud-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 20px;
      background: rgba(20, 20, 40, 0.85);
      border-bottom: 2px solid #8a7b93;
      font-weight: bold;
      font-size: 14px;
      color: #ffd700;
      text-shadow: 1px 1px 0 #000;
      z-index: 10;
      flex-shrink: 0;
    }

    /* Main Stage - Expanded to fill available vertical space */
    .stage {
      flex: 1;
      position: relative;
      width: 100%;
      overflow: hidden;
    }

    .character-avatar {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .character-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover; /* Fills the window completely */
      object-position: center;
    }

    /* Correct Answer Pop-up Box */
    .popup-box {
      position: absolute;
      top: 35%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      background: rgba(15, 23, 42, 0.95);
      border: 4px solid #ffd700;
      border-radius: 12px;
      padding: 20px 40px;
      text-align: center;
      box-shadow: 0 0 25px rgba(255, 215, 0, 0.5), inset 0 0 10px rgba(0,0,0,0.8);
      z-index: 100;
      opacity: 0;
      visibility: hidden;
      transition: all 0.25s ease-in-out;
      pointer-events: none;
    }

    .popup-box.show {
      opacity: 1;
      visibility: visible;
      transform: translate(-50%, -50%) scale(1);
    }

    .popup-title {
      color: #4ade80;
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 10px;
      text-shadow: 2px 2px 0px #000;
    }

    .popup-points {
      color: #ffd700;
      font-size: 32px;
      font-weight: bold;
      text-shadow: 2px 2px 0px #000;
    }
