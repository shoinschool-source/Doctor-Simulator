<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>診断室 ～ Title ～</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }

    body {
      background-color: #111;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: "MS Gothic", "Hiragino Kaku Gothic Pro", Osaka, monospace;
      color: #fff;
    }

    .game-screen {
      position: relative;
      width: 100%;
      max-width: 800px;
      height: 650px;
      background: linear-gradient(180deg, #b8d0e8 0%, #e8f0f8 50%, #a0b8d0 100%);
      border: 6px solid #4a3b52;
      border-radius: 8px;
      box-shadow: 0 0 20px rgba(0,0,0,0.8), inset 0 0 10px rgba(255,255,255,0.5);
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .title-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(10, 10, 25, 0.96);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 300;
    }

    .title-box {
      background: rgba(15, 15, 35, 0.95);
      border: 4px solid #d4af37;
      border-radius: 8px;
      padding: 20px 35px;
      text-align: center;
      box-shadow: 0 0 25px rgba(212, 175, 55, 0.4), inset 0 0 10px rgba(0,0,0,0.8);
      max-width: 420px;
      width: 100%;
    }

    .game-main-title {
      font-size: 26px;
      color: #ffd700;
      text-shadow: 2px 2px 0 #000;
      margin-bottom: 4px;
      letter-spacing: 2px;
    }

    .game-sub-title {
      font-size: 12px;
      color: #93c5fd;
      text-shadow: 1px 1px 0 #000;
      margin-bottom: 15px;
    }

    .qr-container {
      background: #ffffff;
      padding: 8px;
      border: 3px solid #d4af37;
      border-radius: 6px;
      display: inline-block;
      margin-bottom: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.6);
    }

    .qr-container img {
      width: 130px;
      height: 130px;
      display: block;
    }

    .title-instructions {
      font-size: 11px;
      color: #e2e8f0;
      line-height: 1.4;
      text-shadow: 1px 1px 0 #000;
      margin-bottom: 12px;
    }

    .title-instructions span {
      color: #cbd5e1;
      font-size: 10px;
    }

    .title-tap-hint {
      font-size: 11px;
      color: #60a5fa;
      cursor: pointer;
      text-decoration: underline;
      text-shadow: 1px 1px 0 #000;
    }

    .title-tap-hint:hover {
      color: #93c5fd;
    }
  </style>
</head>
<body>

<div class="game-screen">
  <div class="title-screen">
    <div class="title-box">
      <div class="game-main-title">診断室</div>
      <div class="game-sub-title">～ English Diagnosis ～</div>
      <div class="qr-container">
        <img id="qrCodeImg" src="" alt="Scan to Play on iPad">
      </div>
      <div class="title-instructions">
        【 iPadでQRコードをスキャン 】<br>
        <span>Scan with your iPad camera to start playing!</span>
      </div>
      <div class="title-tap-hint" onclick="launchGame()">( タップしてこの画面で開始 / Tap to start here )</div>
    </div>
  </div>
</div>

<script>
  // CHANGE THIS to your deployed game.html URL when hosting online
  const gameUrl = window.location.href.replace('index.html', '') + 'game.html';

  window.onload = function() {
    const qrCodeImg = document.getElementById("qrCodeImg");
    qrCodeImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(gameUrl)}`;
  };

  function launchGame() {
    window.location.href = 'game.html';
  }
</script>

</body>
</html>
