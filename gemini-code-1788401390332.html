<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>診療所：英語診断アシスタント</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #f4f6f8;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .game-container {
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 750px;
      padding: 25px;
      text-align: center;
    }
    h1 {
      color: #333;
      font-size: 20px;
      margin-top: 0;
      margin-bottom: 15px;
    }
    .score-board {
      font-size: 16px;
      font-weight: bold;
      color: #0066cc;
      margin-bottom: 20px;
      text-align: right;
    }
    .patient-card {
      background: #eef4fc;
      border: 2px solid #b6d4fe;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 20px;
      min-height: 110px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .patient-title {
      font-weight: bold;
      color: #0c4a6e;
      font-size: 14px;
      margin-bottom: 8px;
    }
    .symptom-text {
      font-size: 18px;
      color: #222;
      font-weight: bold;
    }
    .feedback-box {
      min-height: 30px;
      font-weight: bold;
      font-size: 16px;
      margin-bottom: 20px;
    }
    .feedback-box.correct { color: #28a745; }
    .feedback-box.incorrect { color: #dc3545; }

    .button-grid {
      display: grid;
      grid-template-columns: repeat( auto-fit, minmax(130px, 1fr) );
      gap: 10px;
    }
    .diag-btn {
      background-color: #0066cc;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }
    .diag-btn:hover {
      background-color: #0052a3;
    }
    .diag-btn:active {
      transform: scale(0.98);
    }
    .diag-btn:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

<div class="game-container">
  <h1>診療所：英語診断アシスタント</h1>
  <div class="score-board" id="scoreDisplay">スコア: 0</div>

  <div class="patient-card">
    <div class="patient-title">患者の症状:</div>
    <div class="symptom-text" id="symptomDisplay">Loading...</div>
  </div>

  <div class="feedback-box" id="feedbackDisplay"></div>

  <div class="button-grid" id="buttonGrid"></div>
</div>

<script>
  const scenarios = [
    { symptom: "My head hurts and I feel hot.", diagnosis: "Fever" },
    { symptom: "I have a cough and a runny nose.", diagnosis: "Cold" },
    { symptom: "My stomach hurts after lunch.", diagnosis: "Stomachache" },
    { symptom: "My eyes are red and itchy.", diagnosis: "Allergy" },
    { symptom: "My throat hurts when I talk.", diagnosis: "Sore Throat" },
    { symptom: "I fell down and my head hurts.", diagnosis: "Headache" },
    { symptom: "My tooth hurts when I eat.", diagnosis: "Toothache" },
    { symptom: "My leg hurts and I cannot run.", diagnosis: "Injury" },
    { symptom: "I feel dizzy and very tired.", diagnosis: "Fatigue" },
    { symptom: "My skin is red and hot from the sun.", diagnosis: "Sunburn" }
  ];

  let score = 0;
  let currentScenario = null;
  let isProcessing = false;

  const symptomDisplay = document.getElementById("symptomDisplay");
  const feedbackDisplay = document.getElementById("feedbackDisplay");
  const scoreDisplay = document.getElementById("scoreDisplay");
  const buttonGrid = document.getElementById("buttonGrid");

  function initGame() {
    renderButtons();
    nextPatient();
  }

  function renderButtons() {
    buttonGrid.innerHTML = "";
    scenarios.forEach(scen => {
      const btn = document.createElement("button");
      btn.className = "diag-btn";
      btn.textContent = scen.diagnosis;
      btn.onclick = () => checkDiagnosis(scen.diagnosis);
      buttonGrid.appendChild(btn);
    });
  }

  function nextPatient() {
    isProcessing = false;
    feedbackDisplay.textContent = "";
    feedbackDisplay.className = "feedback-box";
    toggleButtons(true);

    const randomIndex = Math.floor(Math.random() * scenarios.length);
    currentScenario = scenarios[randomIndex];
    symptomDisplay.textContent = `"${currentScenario.symptom}"`;
  }

  function checkDiagnosis(selected) {
    if (isProcessing) return;
    isProcessing = true;
    toggleButtons(false);

    if (selected === currentScenario.diagnosis) {
      score += 10;
      scoreDisplay.textContent = `スコア: ${score}`;
      feedbackDisplay.textContent = "正解です！ +10点";
      feedbackDisplay.className = "feedback-box correct";
    } else {
      feedbackDisplay.textContent = `不正解！ 正しい診断: ${currentScenario.diagnosis}`;
      feedbackDisplay.className = "feedback-box incorrect";
    }

    setTimeout(nextPatient, 1500);
  }

  function toggleButtons(enable) {
    const buttons = buttonGrid.querySelectorAll("button");
    buttons.forEach(btn => btn.disabled = !enable);
  }

  window.onload = initGame;
</script>

</body>
</html>
