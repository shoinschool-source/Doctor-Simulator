<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>診療所メモリーズ ～ English Diagnosis ～</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }

    body {
      background-color: #111;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: "MS Gothic", "Hiragino Kaku Gothic Pro", Osaka, monospace;
      color: #fff;
    }

    /* 90s Game Screen Frame (4:3 aspect ratio feel) */
    .game-screen {
      position: relative;
      width: 100%;
      max-width: 800px;
      height: 600px;
      background: linear-gradient(180deg, #b8d0e8 0%, #e8f0f8 60%, #a0b8d0 100%);
      border: 6px solid #4a3b52;
      border-radius: 8px;
      box-shadow: 0 0 20px rgba(0,0,0,0.8), inset 0 0 10px rgba(255,255,255,0.5);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Top HUD / Status Bar */
    .hud-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 20px;
      background: rgba(20, 20, 40, 0.7);
      border-bottom: 2px solid #8a7b93;
      font-weight: bold;
      font-size: 14px;
      letter-spacing: 1px;
      color: #ffd700;
      text-shadow: 1px 1px 0 #000;
      z-index: 10;
    }

    /* Character Sprite Stage */
    .stage {
      position: absolute;
      bottom: 120px;
      left: 50%;
      transform: translateX(-50%);
      width: 320px;
      height: 380px;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      z-index: 2;
    }

    .character-avatar {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0px 5px 5px rgba(0,0,0,0.3));
    }

    /* 90s Dialogue Box Area */
    .dialogue-container {
      position: absolute;
      bottom: 15px;
      left: 15px;
      right: 15px;
      height: 130px;
      background: rgba(15, 15, 35, 0.85);
      border: 3px solid #d4af37;
      border-radius: 6px;
      padding: 15px 20px;
      box-shadow: inset 0 0 8px rgba(0,0,0,0.8);
      z-index: 5;
    }

    /* Speaker Name Tag Box */
    .name-box {
      position: absolute;
      top: -18px;
      left: 20px;
      background: #8b0000;
      border: 2px solid #d4af37;
      color: #ffffff;
      padding: 2px 14px;
      font-size: 13px;
      font-weight: bold;
      border-radius: 4px;
      letter-spacing: 1px;
      box-shadow: 2px 2px 0px #000;
    }

    .dialogue-text {
      font-size: 18px;
      line-height: 1.5;
      color: #ffffff;
      text-shadow: 1px 1px 2px #000;
      margin-top: 5px;
      white-space: pre-line;
    }

    /* Blinking Next Arrow Prompt */
    .next-arrow {
      position: absolute;
      bottom: 10px;
      right: 15px;
      color: #ffd700;
      font-size: 14px;
      animation: blink 0.8s infinite alternate;
    }

    @keyframes blink {
      0% { opacity: 0.2; transform: translateY(0); }
      100% { opacity: 1; transform: translateY(3px); }
    }

    /* 90s Branching Choice Overlay Menu */
    .choice-overlay {
      position: absolute;
      top: 60px;
      left: 0;
      right: 0;
      bottom: 160px;
      background: rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 8;
      padding: 10px;
    }

    .choice-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      width: 90%;
      max-width: 600px;
    }

    .choice-btn {
      background: linear-gradient(180deg, #1f2937 0%, #111827 100%);
      border: 2px solid #6b7280;
      color: #f3f4f6;
      padding: 10px 15px;
      font-family: inherit;
      font-size: 14px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      text-align: left;
      transition: all 0.15s ease;
      box-shadow: 2px 2px 4px rgba(0,0,0,0.5);
    }

    .choice-btn:hover {
      background: linear-gradient(180deg, #b91c1c 0%, #7f1d1d 100%);
      border-color: #ffd700;
      color: #fff;
      transform: translateX(3px);
    }

    .choice-btn::before {
      content: "♥ ";
      color: #ef4444;
      opacity: 0;
    }

    .choice-btn:hover::before {
      opacity: 1;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="game-screen">
  <!-- Top Status HUD -->
  <div class="hud-bar">
    <span>LOCATION: 診察室 (Clinic)</span>
    <span id="scoreDisplay">SCORE: 0</span>
  </div>

  <!-- Character Stage -->
  <div class="stage">
    <div id="characterAvatar" class="character-avatar"></div>
  </div>

  <!-- Branching Choice Menu -->
  <div class="choice-overlay" id="choiceOverlay">
    <div class="choice-grid" id="choiceGrid"></div>
  </div>

  <!-- Dialogue Window -->
  <div class="dialogue-container">
    <div class="name-box" id="nameBox">患者</div>
    <div class="dialogue-text" id="dialogueText">Loading...</div>
    <div class="next-arrow">▼</div>
  </div>
</div>

<script>
  // Helper to generate SVG characters (Anime-style, diverse ages/genders)
  function createAvatarSVG(type) {
    const svgs = {
      // 1. Teen Boy (Fever)
      teen_boy: `<svg viewBox="0 0 200 250" xmlns="http://www.w3.org/2000/svg">
        <path d="M60 220 C60 180 140 180 140 220" fill="#3b82f6"/>
        <circle cx="100" cy="130" r="45" fill="#ffdbac"/>
        <!-- Spiky Hair -->
        <path d="M55 120 Q70 70 100 70 Q130 70 145 120 Q120 90 100 100 Q80 90 55 120" fill="#1e293b"/>
        <!-- Eyes -->
        <ellipse cx="85" cy="130" rx="5" ry="8" fill="#0f172a"/>
        <ellipse cx="115" cy="130" rx="5" ry="8" fill="#0f172a"/>
        <!-- Sad Mouth -->
        <path d="M90 155 Q100 145 110 155" stroke="#9a3412" stroke-width="3" fill="none"/>
        <!-- Fever Patch -->
        <rect x="80" y="95" width="40" height="15" rx="3" fill="#93c5fd" opacity="0.8"/>
      </svg>`,

      // 2. Young Woman (Cold)
      young_woman: `<svg viewBox="0 0 200 250" xmlns="http://www.w3.org/2000/svg">
        <path d="M50 220 C50 170 150 170 150 220" fill="#ec4899"/>
        <!-- Long Hair Back -->
        <path d="M50 100 Q100 50 150 100 L160 200 L40 200 Z" fill="#7c2d12"/>
        <circle cx="100" cy="130" r="42" fill="#ffe4e1"/>
        <!-- Bangs -->
        <path d="M55 115 Q100 85 145 115 Q120 100 100 105 Q80 100 55 115" fill="#7c2d12"/>
        <ellipse cx="82" cy="130" rx="5" ry="7" fill="#451a03"/>
        <ellipse cx="118" cy="130" rx="5" ry="7" fill="#451a03"/>
        <path d="M92 155 Q100 150 108 155" stroke="#9f1239" stroke-width="2" fill="none"/>
      </svg>`,

      // 3. Businessman (Stomachache)
      salaryman: `<svg viewBox="0 0 200 250" xmlns="http://www.w3.org/2000/svg">
        <path d="M50 220 L70 160 L130 160 L150 220 Z" fill="#1e293b"/>
        <polygon points="100,160 92,190 100,210 108,190" fill="#dc2626"/>
        <circle cx="100" cy="120" r="40" fill="#fde047" opacity="0.9"/>
        <path d="M60 110 Q100 70 140 110 Q120 90 100 90 Q80 90 60 110" fill="#334155"/>
        <!-- Swirl Eyes (Dizzy/Pain) -->
        <circle cx="85" cy="120" r="6" stroke="#000" stroke-width="2" fill="none"/>
        <circle cx="115" cy="120" r="6" stroke="#000" stroke-width="2" fill="none"/>
        <path d="M88 145 Q100 135 112 145" stroke="#000" stroke-width="2" fill="none"/>
      </svg>`,

      // 4. Teen Girl (Allergy)
      teen_girl: `<svg viewBox="0 0 200 250" xmlns="http://www.w3.org/2000/svg">
        <path d="M55 220 C55 175 145 175 145 220" fill="#10b981"/>
        <circle cx="100" cy="130" r="40" fill="#fed7aa"/>
        <!-- Twin Tails -->
        <path d="M40 110 Q30 160 50 180" stroke="#b45309" stroke-width="12" fill="none"/>
        <path d="M160 110 Q170 160 150 180" stroke="#b45309" stroke-width="12" fill="none"/>
        <path d="M60 110 Q100 80 140 110" fill="#b45309"/>
        <!-- Red Allergy Eyes -->
        <ellipse cx="83" cy="130" rx="6" ry="6" fill="#ef4444"/>
        <ellipse cx="117" cy="130" rx="6" ry="6" fill="#ef4444"/>
        <path d="M90 152 Q100 148 110 152" stroke="#78350f" stroke-width="2" fill="none"/>
      </svg>`,

      // 5. Elderly Man (Sore Throat)
      old_man: `<svg viewBox="0 0 200 250" xmlns="http://www.w3.org/2000/svg">
        <path d="M50 220 C50 180 150 180 150 220" fill="#64748b"/>
        <circle cx="100" cy="130" r="42" fill="#ffedd5"/>
        <!-- Balding Grey Hair -->
        <path d="M58 130 Q55 90 75 90 Q85 110 58 130" fill="#94a3b8"/>
        <path d="M142 130 Q145 90 125 90 Q115 110 142 130" fill="#94a3b8"/>
        <!-- Glasses -->
        <circle cx="82" cy="130" r="10" stroke="#000" stroke-width="2" fill="none"/>
        <circle cx="118" cy="130" r="10" stroke="#000" stroke-width="2" fill="none"/>
        <line x1="92" y1="130" x2="108" y2="130" stroke="#000" stroke-width="2"/>
        <path d="M90 158 Q100 150 110 158" stroke="#000" stroke-width="2" fill="none"/>
      </svg>`,

      // 6. Athletic Young Man (Headache)
      sporty_guy: `<svg viewBox="0 0 200 250" xmlns="http://www.w3.org/2000/svg">
        <path d="M50 220 L65 170 L135 170 L150 220 Z" fill="#f97316"/>
        <circle cx="100" cy="125" r="42" fill="#fbcfe8"/>
        <!-- Bandage on Head -->
        <rect x="60" y="95" width="80" height="18" fill="#ffffff" rx="4" transform="rotate(-5 100 105)"/>
        <path d="M55 110 Q100 75 145 110" fill="#15803d"/>
        <ellipse cx="83" cy="130" rx="5" ry="7" fill="#0f172a"/>
        <ellipse cx="117" cy="130" rx="5" ry="7" fill="#0f172a"/>
        <path d="M90 155 Q100 145 110 155" stroke="#000" stroke-width="2" fill="none"/>
      </svg>`,

      // 7. Child / Young Boy (Toothache)
      kid_boy: `<svg viewBox="0 0 200 250" xmlns="http://www.w3.org/2000/svg">
        <path d="M60 220 C60 185 140 185 140 220" fill="#eab308"/>
        <!-- Swollen Cheek -->
        <circle cx="100" cy="140" r="38" fill="#ffedd5"/>
        <circle cx="125" cy="150" r="16" fill="#ffedd5"/> 
        <path d="M62 120 Q100 80 138 120" fill="#a16207"/>
        <circle cx="85" cy="135" r="5" fill="#000"/>
        <circle cx="115" cy="135" r="5" fill="#000"/>
        <path d="M88 160 Q100 150 112 158" stroke="#000" stroke-width="2" fill="none"/>
      </svg>`,

      // 8. Female Athlete (Injury)
      female_athlete: `<svg viewBox="0 0 200 250" xmlns="http://www.w3.org/2000/svg">
        <path d="M50 220 C50 170 150 170 150 220" fill="#06b6d4"/>
        <circle cx="100" cy="125" r="40" fill="#fed7aa"/>
        <!-- Short Cap/Hair -->
        <path d="M58 115 Q100 70 142 115" fill="#1e1b4b"/>
        <ellipse cx="83" cy="128" rx="5" ry="7" fill="#000"/>
        <ellipse cx="117" cy="128" rx="5" ry="7" fill="#000"/>
        <path d="M88 152 Q100 142 112 152" stroke="#000" stroke-width="2" fill="none"/>
      </svg>`,

      // 9. Elderly Woman (Fatigue)
      old_woman: `<svg viewBox="0 0 200 250" xmlns="http://www.w3.org/2000/svg">
        <path d="M50 220 C50 180 150 180 150 220" fill="#a855f7"/>
        <!-- Bun Hair -->
        <circle cx="100" cy="75" r="20" fill="#cbd5e1"/>
        <circle cx="100" cy="130" r="42" fill="#ffedd5"/>
        <path d="M60 120 Q100 90 140 120" fill="#cbd5e1"/>
        <!-- Tired Eyes -->
        <path d="M75 130 Q83 138 91 130" stroke="#000" stroke-width="2" fill="none"/>
        <path d="M109 130 Q117 138 125 130" stroke="#000" stroke-width="2" fill="none"/>
        <path d="M90 155 Q100 150 110 155" stroke="#000" stroke-width="2" fill="none"/>
      </svg>`,

      // 10. Tourist / Young Adult (Sunburn)
      tourist: `<svg viewBox="0 0 200 250" xmlns="http://www.w3.org/2000/svg">
        <path d="M50 220 C50 175 150 175 150 220" fill="#f43f5e"/>
        <!-- Sunburned Red Face -->
        <circle cx="100" cy="130" r="42" fill="#f87171"/>
        <!-- Blonde Hair -->
        <path d="M55 115 Q100 75 145 115" fill="#fde047"/>
        <ellipse cx="83" cy="130" rx="5" ry="7" fill="#0f172a"/>
        <ellipse cx="117" cy="130" rx="5" ry="7" fill="#0f172a"/>
        <path d="M88 155 Q100 145 112 155" stroke="#7f1d1d" stroke-width="2" fill="none"/>
      </svg>`
    };
    return svgs[type] || svgs.teen_boy;
  }

  // 10 Game Scenarios
  const scenarios = [
    { symptom: "My head hurts and I feel hot...", diagnosis: "Fever", avatar: "teen_boy", name: "男子高校生 (High Schooler)" },
    { symptom: "I have a cough and a runny nose...", diagnosis: "Cold", avatar: "young_woman", name: "女性会社員 (Office Worker)" },
    { symptom: "My stomach hurts after lunch...", diagnosis: "Stomachache", avatar: "salaryman", name: "サラリーマン (Businessman)" },
    { symptom: "My eyes are red and itchy...", diagnosis: "Allergy", avatar: "teen_girl", name: "女子中学生 (Junior High Girl)" },
    { symptom: "My throat hurts when I talk...", diagnosis: "Sore Throat", avatar: "old_man", name: "おじいさん (Elderly Man)" },
    { symptom: "I fell down and my head hurts...", diagnosis: "Headache", avatar: "sporty_guy", name: "青年 (Young Man)" },
    { symptom: "My tooth hurts when I eat...", diagnosis: "Toothache", avatar: "kid_boy", name: "男の子 (Young Boy)" },
    { symptom: "My leg hurts and I cannot run...", diagnosis: "Injury", avatar: "female_athlete", name: "女性アスリート (Athlete)" },
    { symptom: "I feel dizzy and very tired...", diagnosis: "Fatigue", avatar: "old_woman", name: "おばあさん (Elderly Woman)" },
    { symptom: "My skin is red and hot from the sun...", diagnosis: "Sunburn", avatar: "tourist", name: "旅行者 (Tourist)" }
  ];

  let score = 0;
  let currentScenario = null;
  let isProcessing = false;

  const dialogueText = document.getElementById("dialogueText");
  const nameBox = document.getElementById("nameBox");
  const scoreDisplay = document.getElementById("scoreDisplay");
  const characterAvatar = document.getElementById("characterAvatar");
  const choiceGrid = document.getElementById("choiceGrid");
  const choiceOverlay = document.getElementById("choiceOverlay");

  function initGame() {
    renderChoices();
    nextPatient();
  }

  function renderChoices() {
    choiceGrid.innerHTML = "";
    scenarios.forEach(scen => {
      const btn = document.createElement("button");
      btn.className = "choice-btn";
      btn.textContent = scen.diagnosis;
      btn.onclick = () => checkDiagnosis(scen.diagnosis);
      choiceGrid.appendChild(btn);
    });
  }

  function nextPatient() {
    isProcessing = false;
    choiceOverlay.classList.remove("hidden");

    const randomIndex = Math.floor(Math.random() * scenarios.length);
    currentScenario = scenarios[randomIndex];

    nameBox.textContent = currentScenario.name;
    dialogueText.textContent = `"${currentScenario.symptom}"`;
    characterAvatar.innerHTML = createAvatarSVG(currentScenario.avatar);
  }

  function checkDiagnosis(selected) {
    if (isProcessing) return;
    isProcessing = true;

    choiceOverlay.classList.add("hidden");

    if (selected === currentScenario.diagnosis) {
      score += 10;
      scoreDisplay.textContent = `SCORE: ${score}`;
      dialogueText.textContent = `【正解】\n「ありがとう、先生！(Thank you, Doctor!)」\n(+10 Points)`;
    } else {
      dialogueText.textContent = `【不正解】\n「えっ…？ 正しい診断は ${currentScenario.diagnosis} です…」`;
    }

    setTimeout(nextPatient, 2000);
  }

  window.onload = initGame;
</script>

</body>
</html>
